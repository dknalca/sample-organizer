[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sample-organizer"
version = "0.1.0"
description = "Safe desktop organizer for musical sample libraries"
requires-python = ">=3.12"
dependencies = ["PySide6>=6.7,<7"]

[project.optional-dependencies]
dev = ["pytest>=8"]
package = ["pyinstaller>=6.10"]

[project.scripts]
sample-organizer = "sample_organizer.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
